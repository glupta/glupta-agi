name: glupta-crawl

services:
  app:
    build: .
    restart: unless-stopped
    user: "${GLUPTA_UID:-501}:${GLUPTA_GID:-20}"
    environment:
      GLUPTA_INPUT_ROOT: /data/inputs
      GLUPTA_INTAKE_TOKEN_FILE: /run/private/intake-token
      GLUPTA_POSTGRES_PASSWORD_FILE: /run/private/postgres-password
      GLUPTA_POSTGRES_HOST: postgres
      GLUPTA_POSTGRES_PORT: 5432
      GLUPTA_CODEX_HOME: /run/codex
      GLUPTA_HOST: 0.0.0.0
      GLUPTA_PORT: 8080
    tmpfs:
      - "/run/codex:rw,noexec,nosuid,nodev,size=67108864,uid=${GLUPTA_UID:-501},gid=${GLUPTA_GID:-20},mode=0700"
    volumes:
      - ${GLUPTA_INPUT_DIR:-./inputs}:/data/inputs:ro
      - ${GLUPTA_RUNTIME_DIR:-./runtime}/intake-token:/run/private/intake-token:ro
      - ${GLUPTA_RUNTIME_DIR:-./runtime}/postgres-password:/run/private/postgres-password:ro
      - type: bind
        source: ${GLUPTA_SECONDARY_CODEX_AUTH_FILE:?set GLUPTA_SECONDARY_CODEX_AUTH_FILE}
        target: /run/codex/auth.json
        read_only: false
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:${GLUPTA_PORT:-8765}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: glupta
      POSTGRES_USER: glupta
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glupta -d glupta"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

secrets:
  postgres-password:
    file: ${GLUPTA_RUNTIME_DIR:-./runtime}/postgres-password

volumes:
  postgres-data:

networks:
  private:
