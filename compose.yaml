name: glupta-crawl

services:
  app:
    build: .
    restart: unless-stopped
    user: "${GLUPTA_UID:?set GLUPTA_UID}:${GLUPTA_GID:?set GLUPTA_GID}"
    environment:
      GLUPTA_INPUT_ROOT: /data/inputs
      GLUPTA_INTAKE_TOKEN_FILE: /run/private/intake-token
      GLUPTA_POSTGRES_PASSWORD_FILE: /run/private/postgres-password
      GLUPTA_POSTGRES_HOST: postgres
      GLUPTA_POSTGRES_PORT: 5432
      GLUPTA_RELEASE_PROFILE_FILE: /run/private/release-profile.json
      GLUPTA_OPENAI_API_KEY_FILE: /run/private/openai-api-key
      GLUPTA_CREDENTIAL_GENERATION: ${GLUPTA_CREDENTIAL_GENERATION:?set GLUPTA_CREDENTIAL_GENERATION}
      GLUPTA_HOST: 0.0.0.0
      GLUPTA_PORT: 8080
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=67108864,uid=${GLUPTA_UID},gid=${GLUPTA_GID},mode=0700"
    volumes:
      - ${GLUPTA_INPUT_DIR:-./inputs}:/data/inputs:ro
      - ${GLUPTA_RUNTIME_DIR:-./runtime}/intake-token:/run/private/intake-token:ro
      - ${GLUPTA_RUNTIME_DIR:-./runtime}/postgres-password:/run/private/postgres-password:ro
      - type: bind
        source: ${GLUPTA_RELEASE_PROFILE_FILE:?set GLUPTA_RELEASE_PROFILE_FILE}
        target: /run/private/release-profile.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GLUPTA_OPENAI_API_KEY_FILE:?set GLUPTA_OPENAI_API_KEY_FILE}
        target: /run/private/openai-api-key
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 127.0.0.1:${GLUPTA_PORT:-8765}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: glupta
      POSTGRES_USER: glupta
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glupta -d glupta"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

secrets:
  postgres-password:
    file: ${GLUPTA_RUNTIME_DIR:-./runtime}/postgres-password

volumes:
  postgres-data:

networks:
  private:
