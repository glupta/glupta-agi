name: glupta-crawl

services:
  app:
    image: glupta-crawl@sha256:a6d4026c9753313a3a22e27fde5d121e4f0b95872293eaad84eeffecb68e1bdf
    restart: unless-stopped
    user: "65532:65532"
    environment:
      GLUPTA_INPUT_ROOT: /data/inputs
      GLUPTA_INTAKE_TOKEN_FILE: /run/private/intake-token
      GLUPTA_POSTGRES_PASSWORD_FILE: /run/private/postgres-password
      GLUPTA_POSTGRES_HOST: postgres
      GLUPTA_POSTGRES_PORT: 5432
      GLUPTA_RELEASE_PROFILE_FILE: /run/private/release-profile.json
      GLUPTA_OPENAI_API_KEY_FILE: /run/private/openai-api-key
      GLUPTA_CREDENTIAL_GENERATION: ${GLUPTA_CREDENTIAL_GENERATION:?set GLUPTA_CREDENTIAL_GENERATION}
      GLUPTA_HOST: 0.0.0.0
      GLUPTA_PORT: 8080
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=67108864,uid=65532,gid=65532,mode=0700"
    volumes:
      - ${GLUPTA_INPUT_DIR:-./inputs}:/data/inputs:ro
      - type: volume
        source: app-private
        target: /run/private
        read_only: true
        volume:
          nocopy: true
    ports:
      - 127.0.0.1:${GLUPTA_PORT:-8765}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      private:
        ipv4_address: 172.30.47.2

  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: glupta
      POSTGRES_USER: glupta
      POSTGRES_PASSWORD_FILE: /run/private/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: volume
        source: postgres-private
        target: /run/private
        read_only: true
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glupta -d glupta"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      private:
        ipv4_address: 172.30.47.3

volumes:
  postgres-data:
  app-private:
    external: true
    name: ${GLUPTA_APP_PRIVATE_VOLUME:?stage an immutable app private volume}
  postgres-private:
    external: true
    name: ${GLUPTA_POSTGRES_PRIVATE_VOLUME:?stage an immutable PostgreSQL private volume}

networks:
  private:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.47.0/29
