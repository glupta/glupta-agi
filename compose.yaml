name: glupta-crawl

services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: glupta
      POSTGRES_USER: glupta
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glupta -d glupta"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - private

secrets:
  postgres-password:
    file: ./runtime/postgres-password

volumes:
  postgres-data:

networks:
  private:
