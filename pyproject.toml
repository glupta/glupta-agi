[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "glupta-agi"
version = "0.2.3"
description = "Private source-grounded evidence briefs for glupta agi"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Proprietary"}
dependencies = [
  "dbos>=2.29,<3",
  "fastapi>=0.141,<1",
  "openai-codex==0.144.4",
  "pydantic-ai-slim[dbos]>=1.107,<2",
  "psycopg[binary]>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "pydantic-evals>=1.0,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[project.scripts]
glupta-agi = "glupta_agi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glupta_agi"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
